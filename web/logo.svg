<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BitLens">
  <title>BitLens</title>
  <!-- lens ring -->
  <circle cx="27" cy="27" r="20" fill="#0d1117" stroke="#00ec97" stroke-width="5"/>
  <!-- bytecode bits seen through the lens: lit = flagged -->
  <g fill="#30363d">
    <rect x="16" y="16" width="6" height="6" rx="1.5"/>
    <rect x="32" y="16" width="6" height="6" rx="1.5"/>
    <rect x="24" y="24" width="6" height="6" rx="1.5"/>
    <rect x="16" y="32" width="6" height="6" rx="1.5"/>
    <rect x="32" y="32" width="6" height="6" rx="1.5"/>
  </g>
  <g fill="#00ec97">
    <rect x="24" y="16" width="6" height="6" rx="1.5"/>
    <rect x="16" y="24" width="6" height="6" rx="1.5"/>
    <rect x="24" y="32" width="6" height="6" rx="1.5"/>
  </g>
  <rect x="32" y="24" width="6" height="6" rx="1.5" fill="#f85149"/>
  <!-- handle -->
  <path d="M42 42 L56 56" stroke="#00ec97" stroke-width="7" stroke-linecap="round"/>
</svg>
